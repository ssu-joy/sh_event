<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>낱말퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#000; --gold:#f2c94c; --gold-hi:#ffe08a; --gold-dim:#8a6d1f; --card:#0e0c06; --cellbg:#120f06;
  --prev:#8f7628; --pink:#ff7eb6; --pinkink:#3a0a22; --bad:#ff8a7a; --ok:#9be3b0;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--gold);
  font-family:"Jua","Gamja Flower","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:50}
h1,.big{font-family:inherit;letter-spacing:0}
h1{font-size:25px;margin:2px 0}
.hear{min-height:26px;margin:14px 0;color:var(--gold-hi);font-size:15px}
.small{font-size:12px;color:var(--gold-dim)}

/* ---------- 첫 화면 (파스텔 구름 + 나무 간판) ---------- */
body.in-gate::before{background:#fde9cf}
.gate{position:relative;overflow:hidden;width:100%;min-height:100vh;display:flex;justify-content:center;align-items:center;
  background:linear-gradient(180deg,#fdeed8 0%,#fbe3c4 55%,#fdeed8 100%);color:#5a2f0f;text-align:center}
.gate::before{content:"";position:absolute;inset:0 0 auto;height:55%;pointer-events:none;
  background:
    radial-gradient(circle 70px at 6% 18%,rgba(255,255,255,.85) 98%,transparent 100%),
    radial-gradient(circle 52px at 18% 10%,rgba(255,255,255,.8) 98%,transparent 100%),
    radial-gradient(circle 60px at 4% 42%,rgba(255,255,255,.7) 98%,transparent 100%),
    radial-gradient(circle 64px at 96% 22%,rgba(255,255,255,.85) 98%,transparent 100%),
    radial-gradient(circle 48px at 84% 12%,rgba(255,255,255,.75) 98%,transparent 100%),
    radial-gradient(circle 56px at 100% 50%,rgba(255,255,255,.7) 98%,transparent 100%)}
.gate::after{content:"";position:absolute;inset:auto 0 0;height:30%;pointer-events:none;
  background:
    radial-gradient(circle 150px at 0% 78%,#ffd75e 98%,transparent 100%),
    radial-gradient(circle 160px at 100% 70%,#ffd75e 98%,transparent 100%),
    radial-gradient(circle 120px at 22% 112%,#fff 98%,transparent 100%),
    radial-gradient(circle 150px at 52% 118%,#fff7e6 98%,transparent 100%),
    radial-gradient(circle 120px at 80% 112%,#fff 98%,transparent 100%)}
.g-inner{position:relative;z-index:2;width:100%;max-width:480px;padding:20px 20px 70px;display:flex;flex-direction:column;align-items:center}
.g-hero{position:relative;width:min(340px,88vw);display:flex;justify-content:center;z-index:1}
.g-hero .face-lg{width:min(270px,68vw);margin:0}
.tile{position:absolute;display:grid;place-items:center;width:50px;height:50px;border-radius:14px;font-size:27px;font-weight:700;
  border:3px solid rgba(255,255,255,.95);box-shadow:0 5px 10px rgba(120,80,30,.25),inset 0 -4px 0 rgba(0,0,0,.08);animation:float 3s ease-in-out infinite}
.t1{left:2%;top:8%;transform:rotate(-14deg);background:linear-gradient(#ffc9d9,#ff9fba);color:#d6456f}
.t2{right:3%;top:10%;width:58px;height:58px;font-size:32px;transform:rotate(12deg);background:linear-gradient(#9fc8ff,#5f9bf0);color:#fff;animation-delay:.6s}
.t3{right:-2%;top:50%;width:46px;height:46px;font-size:24px;transform:rotate(16deg);background:linear-gradient(#ffe48a,#ffc13d);color:#e0801a;animation-delay:1.2s}
@keyframes float{50%{translate:0 -7px}}
.star{position:absolute;width:24px;height:24px;background:#ffc83d;filter:drop-shadow(0 2px 0 #e59a1c);
  clip-path:polygon(50% 0,62% 34%,98% 36%,70% 58%,80% 92%,50% 72%,20% 92%,30% 58%,2% 36%,38% 34%)}
.s1{left:8%;top:40%}.s2{right:26%;top:38%;width:17px;height:17px}.s3{left:-2%;bottom:10%;width:20px;height:20px}
.spark{position:absolute;color:#fff;font-size:20px;text-shadow:0 0 6px #ffe9a8}.sp1{left:24%;top:30%}.sp2{right:12%;bottom:22%}
.sign{position:relative;z-index:3;margin:-30px 0 18px;padding:12px 30px 18px;border-radius:40px;
  background:repeating-linear-gradient(100deg,rgba(255,255,255,.07) 0 6px,transparent 6px 14px),linear-gradient(#f4bb6b,#dc9340 55%,#cb7b2d);
  border:4px solid #a45f22;box-shadow:0 8px 0 #8a4c18,0 16px 22px rgba(120,70,20,.35),inset 0 3px 0 rgba(255,255,255,.4)}
.sign-t{display:block;font-size:clamp(44px,15vw,64px);line-height:1.15;color:#fff;letter-spacing:2px;
  -webkit-text-stroke:10px #6b3412;paint-order:stroke fill;text-shadow:0 5px 0 #4d250c}
.crown{position:absolute;left:-14px;top:-30px;font-size:46px;transform:rotate(-18deg);filter:drop-shadow(0 3px 0 rgba(120,70,20,.4))}
.zap{position:absolute;right:-6px;top:-22px;width:40px;height:40px}
.zap b{position:absolute;width:9px;height:24px;border-radius:6px;background:#ffd23f;border:2px solid #fff;transform-origin:center}
.zap b:nth-child(1){left:6px;top:8px;transform:rotate(-38deg)}
.zap b:nth-child(2){left:18px;top:0;transform:rotate(8deg)}
.zap b:nth-child(3){left:30px;top:8px;transform:rotate(48deg)}
.g-panel{width:100%}
.g-q,.g-msg{font-size:27px;line-height:1.45;margin:0;color:#5a2f0f}
.ln{display:block;white-space:nowrap}
.g-line{display:block;width:62%;height:12px;margin:2px auto 22px}
.g-line path{fill:none;stroke:#ffcf3f;stroke-width:4;stroke-linecap:round}
.yn{display:flex;gap:16px;justify-content:center}
.yn button{flex:1;max-width:190px;font-size:30px;padding:16px 0;border-radius:30px;font-weight:400;letter-spacing:1px;transition:transform .08s}
#yes{background:linear-gradient(#ffe56f,#ffc42a);color:#5a2f0f;border:3px solid #e8941c;box-shadow:0 7px 0 #d9801a,0 14px 18px rgba(200,120,20,.35),inset 0 3px 0 rgba(255,255,255,.75)}
#no{background:linear-gradient(#fffaf0,#f3dcc0);color:#5a2f0f;border:3px solid #cda37a;box-shadow:0 7px 0 #b98a5e,0 14px 18px rgba(150,100,60,.3),inset 0 3px 0 rgba(255,255,255,.9)}
.yn button:active{transform:translateY(5px)}
#yes:active{box-shadow:0 2px 0 #d9801a,inset 0 3px 0 rgba(255,255,255,.75)}
#no:active{box-shadow:0 2px 0 #b98a5e,inset 0 3px 0 rgba(255,255,255,.9)}
.g-card{background:rgba(255,251,242,.94);border:3px solid #e6c28e;border-radius:28px;padding:20px 16px;box-shadow:0 8px 0 #d9b27a,0 14px 22px rgba(150,100,50,.25)}
.g-msg{margin-bottom:16px}
.gate .row{margin-top:4px}
.gate input{background:#fffdf7;color:#5a2f0f;border:2.5px solid #d9a766;border-radius:16px;font-size:18px}
.gate input::placeholder{color:#b8996f}
.gate input:focus-visible,.gate button:focus-visible{outline:3px solid #ffb01f;outline-offset:2px}
.gate #gOk,.gate #go{background:linear-gradient(#ffe56f,#ffc42a);color:#5a2f0f;border:3px solid #e8941c;border-radius:18px;box-shadow:0 4px 0 #d9801a;font-size:17px}
.gate #go{font-size:22px;padding:12px 34px;border-radius:24px}
.gate .small,#gFb{color:#a45f22;font-size:14px;min-height:20px;margin:8px 0 0}
main{max-width:520px;margin:0 auto;padding:18px 14px 40px}
.lead{margin:0 0 14px;color:var(--gold-dim);font-size:14px}
.board{border:1.5px solid var(--gold-dim);border-radius:16px;padding:12px;overflow-x:auto;background:var(--card)}
.grid{--cs:min(34px,calc((100vw - 100px)/11));display:grid;grid-template-columns:repeat(11,var(--cs));grid-auto-rows:var(--cs);gap:3px;justify-content:center}
.gap{visibility:hidden}
.cell{position:relative;display:flex;align-items:center;justify-content:center;border-radius:7px;background:var(--cellbg);color:var(--gold);
  border:1.5px solid var(--gold-dim);font-size:calc(var(--cs)*.55);font-weight:700;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.cell .n{position:absolute;top:0;left:2px;font-size:8px;font-weight:800;color:#5a4a6a;line-height:1.3}
.cell.prev{color:rgba(42,36,56,.5)!important}
.cell.act{outline:2.5px solid #fff;outline-offset:0;z-index:1}
.cell.pink{background:#ff2e93!important;border-color:#ff2e93!important;color:#fff!important;box-shadow:0 0 10px rgba(255,46,147,.7);animation:pop .35s}
.cell.pop{animation:pop .4s}
.shake{animation:shake .3s}
@keyframes pop{50%{transform:scale(1.2)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;justify-content:center}
.chip{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--gold-dim);background:var(--bg);color:var(--gold);font:inherit;font-weight:700;font-size:14px;padding:0;cursor:pointer}
.chip.ok{background:var(--gold);border-color:var(--gold);color:#000}
.stage{border:1.5px solid var(--gold-dim);background:var(--card);border-radius:14px;padding:14px;text-align:center;font-weight:700;font-size:16px;margin-bottom:12px}
.stage small{display:block;color:var(--gold-dim);font-weight:500;font-size:13px;margin-top:2px}
.stage.done{background:var(--gold);color:#000;border-color:var(--gold)}
.sheet,.answer{--h:165}
.answer{border:1.5px solid hsl(var(--h),78%,66%);background:hsl(var(--h),42%,12%);border-radius:14px;padding:14px;margin-bottom:12px}
.tray{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.tray button{width:40px;height:40px;border-radius:9px;border:0;background:var(--pink);color:var(--pinkink);font:inherit;font-size:20px;font-weight:800;cursor:pointer;padding:0}
.row{display:flex;gap:6px}
input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border-radius:9px;border:1.5px solid var(--gold-dim);background:#000;color:var(--gold-hi)}
input::placeholder{color:var(--gold-dim)}
button{font:inherit;font-size:15px;border:0;border-radius:14px;padding:10px 16px;background:var(--gold);color:#000;cursor:pointer}
button.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold-dim);font-weight:600}
input:focus-visible,button:focus-visible,.cell:focus-visible{outline:3px solid var(--gold-hi);outline-offset:1px}
.fb{min-height:20px;margin-top:6px;font-size:13px;color:var(--gold-dim)}
.fb.bad{color:var(--bad)} .fb.good{color:var(--ok)}
.reset{width:100%;margin-top:4px}
.sheet{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:15;margin-bottom:12px;background:hsl(var(--h),42%,12%);border:1.5px solid hsl(var(--h),78%,66%);
  border-radius:16px;padding:12px 14px;box-shadow:0 6px 18px rgba(0,0,0,.75)}
.sheet input,.answer input{background:#070707;color:hsl(var(--h),100%,94%);border-color:hsl(var(--h),40%,40%)}
.sheet input::placeholder,.answer input::placeholder{color:hsl(var(--h),30%,45%)}
.sheet button,.answer #aOk{background:hsl(var(--h),78%,66%);color:#111}
.sheet button.ghost,.answer button.ghost{background:transparent;color:hsl(var(--h),78%,66%);border:1.5px solid hsl(var(--h),40%,40%)}
.sheet input:focus-visible,.sheet button:focus-visible,.answer input:focus-visible,.answer button:focus-visible{outline-color:hsl(var(--h),78%,66%)}
.sheet button:disabled,.sheet input:disabled{opacity:.45;cursor:default}
.sheet .fb,.answer .fb{color:hsl(var(--h),60%,75%)}
.sheet .fb.bad,.answer .fb.bad{color:var(--bad)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet .top b{font-size:15px}
.sheet p{margin:0 0 10px;font-size:16px;color:hsl(var(--h),100%,94%)}
.sheet .top b{color:hsl(var(--h),78%,66%)}
.ov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:20px}
.ov .card{background:var(--card);border:1.5px solid var(--gold);border-radius:22px;padding:22px 20px;text-align:center;max-width:340px;width:100%;animation:pop .5s}
.face-ov{width:160px;height:auto;animation:bob 1.2s ease-in-out infinite}
.ov-faces{display:flex;justify-content:center;align-items:flex-end}
.face-ov2{width:118px;height:auto;margin-left:-26px;animation:bob 1.4s ease-in-out .3s infinite}
.face-q{width:52px;height:52px;object-fit:contain;flex:none;margin-right:8px;border-radius:12px;background:rgba(255,255,255,.07)}
.who{display:flex;align-items:center;min-width:0}
.g-male{position:absolute;left:-6px;bottom:4px;width:104px;height:auto;z-index:2;animation:bob 2.2s ease-in-out infinite}
.face-lg{width:190px;height:auto;margin-bottom:6px;animation:bob 2.4s ease-in-out infinite}
.face-sm{width:84px;height:84px;object-fit:contain;flex:none;border-radius:18px;background:radial-gradient(circle,#3a2d0c 0%,#120f06 75%);border:1.5px solid var(--gold-dim)}
.mrow{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.mrow .stage{flex:1;margin:0}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.ov h2{margin:8px 0 14px;font-size:22px;line-height:1.4;font-family:inherit}
#ovMsg{white-space:pre-line}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ---------- 게임 화면 (따뜻한 크림 + 나무 테마) ---------- */
body.in-game{background:linear-gradient(180deg,#fdeed8 0%,#fbe3c4 55%,#fdeed8 100%) fixed;color:#5a2f0f}
body.in-game::before{background:#fdeed8}
#game{padding:6px 14px 40px}
.g-head{position:relative;display:flex;gap:4px;align-items:flex-end;padding-top:8px;min-height:180px}
.hd-girl{flex:0 0 46%;position:relative;z-index:1}
.face-girl{display:block;width:100%;max-width:190px;height:auto;animation:bob 2.6s ease-in-out infinite}
.hd-right{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:4px}
.bubble{position:relative;align-self:flex-start;background:#fffaf4;border:2.5px solid #f2b8b0;border-radius:20px;padding:7px 12px;font-size:14px;line-height:1.3;color:#5a2f0f;box-shadow:0 3px 0 #f2b8b0;margin-left:8px}
.bubble::after{content:"";position:absolute;left:-8px;bottom:10px;width:13px;height:13px;background:#fffaf4;border-left:2.5px solid #f2b8b0;border-bottom:2.5px solid #f2b8b0;transform:rotate(45deg)}
.sign.sm{margin:10px 0 0;padding:6px 20px 12px;border-radius:30px;border-width:3px;box-shadow:0 5px 0 #8a4c18,0 10px 14px rgba(120,70,20,.3),inset 0 2px 0 rgba(255,255,255,.4)}
.sign.sm .sign-t{font-size:clamp(28px,9vw,40px);-webkit-text-stroke:7px #6b3412;text-shadow:0 3px 0 #4d250c}
.sign.sm .crown{font-size:30px;left:-10px;top:-24px}
.lead2{margin:2px 0 0;font-size:13px;line-height:1.45;color:#6b4220;text-align:center}
.lead2 b{color:#ff8a00;font-weight:400}

body.in-game .sheet{--h:28;margin:30px 0 14px;padding:22px 14px 12px;border:3px solid hsl(var(--h),72%,60%);border-radius:26px;
  background:linear-gradient(#fffbf3,#fff2df);color:#5a2f0f;box-shadow:0 5px 0 hsl(var(--h),60%,72%),0 12px 18px rgba(150,100,50,.22)}
body.in-game .sheet::after{content:"💡";position:absolute;right:8px;top:-26px;font-size:42px;filter:drop-shadow(0 0 10px #ffe27a)}
body.in-game .sheet .top{justify-content:flex-end;margin:0;min-height:0}
body.in-game .sheet .who{position:static}
body.in-game .sheet .top b{position:absolute;left:14px;top:-17px;background:linear-gradient(hsl(var(--h),92%,64%),hsl(var(--h),88%,52%));color:#fff;
  padding:4px 18px;border-radius:14px 14px 14px 4px;font-size:17px;font-weight:400;box-shadow:0 3px 0 hsl(var(--h),70%,38%);text-shadow:0 1px 0 rgba(0,0,0,.2)}
body.in-game .sheet p{color:#5a2f0f;font-size:17px;margin:2px 44px 10px 0;line-height:1.45}
body.in-game .sheet input{background:#fff;color:#5a2f0f;border:2.5px solid hsl(var(--h),60%,82%);border-radius:999px;padding:12px 16px}
body.in-game .sheet input::placeholder{color:#c0a07a}
body.in-game .sheet #sOk{background:linear-gradient(hsl(var(--h),96%,68%),hsl(var(--h),92%,54%));color:#fff;border-radius:20px;padding:10px 18px;font-size:17px;
  box-shadow:0 4px 0 hsl(var(--h),70%,40%);text-shadow:0 1px 0 rgba(0,0,0,.25)}
body.in-game .sheet #sHint,body.in-game .sheet #sClose{background:#fff;color:#8a5a2a;border:2px solid hsl(var(--h),60%,80%);border-radius:999px}
body.in-game .sheet #sHint::before{content:"⭐ "}
body.in-game .sheet .fb{color:#a8793f}
body.in-game .sheet button:disabled,body.in-game .sheet input:disabled{opacity:.55}

body.in-game .board{padding:12px;border:8px solid transparent;border-radius:28px;
  background:linear-gradient(#4a2c1a,#4a2c1a) padding-box,linear-gradient(#f6c985,#d99a4a) border-box;box-shadow:0 7px 0 #b97830,0 14px 20px rgba(120,70,20,.3)}
body.in-game .grid{background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:30px 30px}
body.in-game .cell{border:0;border-radius:10px}
body.in-game .cell .n{color:#7a4a1f;font-size:9px}
body.in-game .cell.act{outline:3px solid #fff;z-index:1}
body.in-game .cell.prev{color:rgba(90,47,15,.45)!important}
body.in-game .cell.pink{box-shadow:0 3px 0 #c21874,0 0 12px rgba(255,46,147,.7)!important}
body.in-game .chip{background:#fff9ee;border:2px solid #e0b27a;color:#8a5a2a;box-shadow:0 3px 0 #e0b27a}
body.in-game .chip.ok{background:linear-gradient(#ffc25a,#ff9f1c);border-color:#e28a1a;color:#fff;box-shadow:0 3px 0 #c97712}
body.in-game .stage{background:#fff9ee;border:3px solid #f0c98c;color:#5a2f0f;border-radius:20px;box-shadow:0 4px 0 #e8b975}
body.in-game .stage small{color:#a8793f}
body.in-game .stage.done{background:linear-gradient(#ffe56f,#ffc42a);border-color:#e8941c;color:#5a2f0f}
.boy-row{display:flex;justify-content:flex-end;align-items:flex-end;gap:2px;margin:4px 0 10px}
.face-boy{width:120px;height:auto;flex:none;animation:bob 2.8s ease-in-out infinite}
.bubble-r{align-self:center;margin:0 6px 36px 0}
.bubble-r::after{left:auto;right:-8px;bottom:10px;border:0;border-right:2.5px solid #f2b8b0;border-top:2.5px solid #f2b8b0}
body.in-game .answer{background:linear-gradient(#fffbf3,#fff2df);border:3px solid #f0b86a;border-radius:24px;color:#5a2f0f;box-shadow:0 5px 0 #e8b975}
body.in-game .answer input{background:#fff;color:#5a2f0f;border:2.5px solid #f0d2a2;border-radius:999px}
body.in-game .answer #aOk{background:linear-gradient(#ffb347,#ff8a00);color:#fff;border-radius:20px;box-shadow:0 4px 0 #c76a00}
body.in-game .answer button.ghost{background:#fff;color:#8a5a2a;border:2px solid #f0d2a2;border-radius:999px}
body.in-game .answer .fb{color:#a8793f}
body.in-game .reset{background:transparent;color:#a8793f;border:2px dashed #e0b27a;border-radius:16px}
body.in-game .ov{background:rgba(90,47,15,.6)}
body.in-game .ov .card{background:#fffbf3;border:3px solid #f0b86a;box-shadow:0 8px 0 #e8b975}
body.in-game .ov h2{color:#5a2f0f}
body.in-game .ov button{background:linear-gradient(#ffe56f,#ffc42a);color:#5a2f0f;border:3px solid #e8941c;border-radius:20px;box-shadow:0 4px 0 #d9801a;padding:10px 26px;font-size:18px}

/* ---------- 한 화면에 담기 ---------- */
body.in-game{overflow:hidden}
#game{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:4px 12px 10px;box-sizing:border-box}
.g-head{min-height:0;padding-top:2px;margin-bottom:2px;flex:none}
.hd-girl{flex:0 0 112px}
.face-girl{max-width:112px}
.hd-right{gap:5px;padding-bottom:2px}
.bubble{font-size:13px;padding:5px 11px;margin-left:8px}
.sign.sm{margin:8px 0 0;padding:4px 16px 9px}
.sign.sm .sign-t{font-size:clamp(24px,7.6vw,32px);-webkit-text-stroke:6px #6b3412}
.sign.sm .crown{font-size:26px;top:-20px}
.stage-row{display:flex;gap:6px;align-items:center;width:100%}
body.in-game .stage{flex:1;margin:0;padding:5px 10px;font-size:13px;line-height:1.3;border-width:2.5px;border-radius:16px;box-shadow:0 3px 0 #e8b975}
body.in-game .stage small{display:inline;margin-left:6px;font-size:12px}
.reset-mini{flex:none;width:34px;height:34px;padding:0;border-radius:50%;background:#fff9ee;color:#a8793f;border:2px solid #e0b27a;font-size:18px;box-shadow:0 3px 0 #e0b27a}
.chips{display:none}
body.in-game .sheet{position:relative;top:auto;flex:none;margin:22px 0 4px;padding:16px 12px 8px}
body.in-game .sheet::after{font-size:32px;right:48px;top:-20px}
body.in-game .sheet .top b{top:-15px;font-size:15px;padding:3px 14px}
body.in-game .sheet #sClose{position:absolute;right:8px;top:-14px;width:30px;height:30px;padding:0;border-radius:50%;font-size:14px}
body.in-game .sheet p{font-size:14px;line-height:1.35;margin:0 0 7px}
body.in-game .sheet input{padding:9px 14px;font-size:15px}
body.in-game .sheet #sHint{width:40px;padding:0;flex:none}
body.in-game .sheet #sHint::before{content:""}
body.in-game .sheet #sOk{padding:8px 14px;font-size:15px}
body.in-game .sheet .fb{display:block;min-height:0;margin-top:2px;font-size:12px}
body.in-game .answer{flex:none;margin:8px 0 4px;padding:10px 12px}
body.in-game .answer .tray{margin-bottom:8px}
body.in-game .answer .tray button{width:36px;height:36px;font-size:18px}
body.in-game .answer .fb{min-height:0;margin-top:2px}
body.in-game .board{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px;margin-top:8px}
.boy-ov{position:absolute;right:8px;bottom:6px;width:var(--boyw,80px);display:flex;flex-direction:column;align-items:center;pointer-events:none;z-index:3}
.boy-ov .bubble{margin:0 0 6px;font-size:11px;padding:4px 7px;line-height:1.25;text-align:center;align-self:center}
.boy-ov .bubble::after{left:50%;bottom:-7px;margin-left:-6px;border:0;border-right:2.5px solid #f2b8b0;border-bottom:2.5px solid #f2b8b0;transform:rotate(45deg)}
.face-boy{width:100%;height:auto;animation:none}

/* ---------- 생일 피날레 ---------- */
.fin{position:fixed;inset:0;z-index:34;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(circle at 50% 28%,#fff8e4 0%,#ffe3ec 60%,#ffd0e0 100%)}
.fin-inner{position:relative;z-index:2;width:100%;max-width:480px;padding:0 12px;text-align:center;margin-top:-6vh}
.fin-chars{display:flex;align-items:flex-end;justify-content:center;margin-bottom:8px}
.fin-f,.fin-m{width:33%;max-width:150px;height:auto;animation:bob 2s ease-in-out infinite}
.fin-m{animation-delay:.4s}
.fin-cake{width:35%;max-width:160px;margin:0 -8px;position:relative;z-index:2;animation:cakepop .8s cubic-bezier(.3,1.6,.5,1) both}
@keyframes cakepop{from{transform:scale(0) rotate(-25deg)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .45s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1) rotate(-4deg)}to{transform:scale(1.18,.88) rotate(4deg)}}
.fin-t{font-size:clamp(25px,8vw,36px);line-height:1.35;margin:4px 0 14px;color:#e0457b;white-space:pre-line;
  -webkit-text-stroke:7px #fff;paint-order:stroke fill;text-shadow:0 4px 0 #f6b3c8}
.fin-t.swap{animation:pop .55s}
.fin-btns{display:flex;gap:10px;justify-content:center;min-height:46px}
.fin-btns button{background:linear-gradient(#ffe56f,#ffc42a);color:#5a2f0f;border:3px solid #e8941c;border-radius:20px;box-shadow:0 4px 0 #d9801a;padding:9px 22px;font-size:18px}
.fstar{position:absolute;width:22px;height:22px;background:#ffc83d;clip-path:polygon(50% 0,62% 34%,98% 36%,70% 58%,80% 92%,50% 72%,20% 92%,30% 58%,2% 36%,38% 34%);animation:float 2.4s ease-in-out infinite}
.fs1{left:8%;top:12%}.fs2{right:10%;top:18%;width:16px;height:16px;animation-delay:.5s}.fs3{left:14%;top:55%;width:14px;height:14px;animation-delay:1s}.fs4{right:7%;top:60%;animation-delay:1.4s}
.balloon{position:absolute;left:50%;bottom:3vh;width:92px;height:auto;z-index:3;transform-origin:50% 100%;transform:translateX(-50%) scale(.12);pointer-events:none}
.balloon.inflate{animation:inflate 2.8s ease-in-out forwards}
@keyframes inflate{0%{transform:translateX(-50%) scale(.12)}55%{transform:translateX(-50%) scale(1.55)}68%{transform:translateX(-50%) scale(1.4)}100%{transform:translateX(-50%) scale(1.75)}}
.balloon.fly{animation:fly 4.2s ease-in forwards}
@keyframes fly{0%{transform:translateX(-50%) translateY(0) scale(1.75) rotate(0)}25%{transform:translateX(-32%) translateY(-30vh) scale(1.75) rotate(9deg)}55%{transform:translateX(-68%) translateY(-76vh) scale(1.75) rotate(-9deg)}100%{transform:translateX(-50%) translateY(-160vh) scale(1.75) rotate(5deg)}}
</style>
</head>

<script>
const $=id=>document.getElementById(id);
const pick=(n,rand)=>{const a=FACES[n];return rand?a[Math.random()*a.length|0]:a[0];};
function setImg(el,n,rand){const u=pick(n,rand);if(el.getAttribute("src")!==u)el.setAttribute("src",u);}
const mpick=(n,rand)=>{const a=MFACES[n];return rand?a[Math.random()*a.length|0]:a[0];};
function setImgM(el,n,rand){const u=mpick(n,rand);if(el.getAttribute("src")!==u)el.setAttribute("src",u);}
let sleeping=false, gateState="wave", reactUntil=0, qReactUntil=0, gMaleState=null, sleepT=null;
function gateMale(n,rand){gMaleState=n;const el=$("gMale");if(!n){el.hidden=true;return;}el.hidden=false;setImgM(el,sleeping?"sleep":n,rand);}
const FMSG={wave:"번호를 골라 주세요!",smile:"문제를 내볼게요!",wink:"정답이에요! 👍",pout:"아쉬워요~ 다시!",surprise:"오! 찾았나요?",love:"참 잘했어요 ♡",cheer:"좋아요!",cry:"앗…",sleep:"쿨쿨…"};
const MMSG={think:"어떤 단어가 들어갈까?",cheer:"좋았어! 맞혔다!",surprise:"앗, 틀렸다!",peek:"살짝만 볼까…",love:"해냈다 ♡",tiles:"어서 풀어보자!",smile:"좋아, 계속 가자!",sleep:"쿨쿨…"};
function setQ(n,rand,msg){setImg($("qFace"),n,rand);$("qMsg").textContent=msg||FMSG[n]||"";}
function setM(n,rand,msg){setImgM($("mFace"),n,rand);$("mMsg").textContent=msg||MMSG[n]||"";}
function baseQ(){
  if(S.phase==="done")return ["love","참 잘했어요 ♡"];
  if(S.phase==="wait")return ["wink","대단해요!"];
  if(S.phase==="touch")return ["wink","겹치는 칸을 찾아봐요!"];
  if(S.phase==="answer")return ["smile","순서를 조합해 봐요!"];
  return S.active?["smile","문제를 내볼게요!"]:["wave","번호를 골라 주세요!"];
}
function baseM(){
  if(S.phase==="done")return ["love","해냈다 ♡"];
  if(S.phase==="wait")return ["cheer","다 풀었다!"];
  if(S.phase==="touch")return ["think","겹치는 칸이 어디지?"];
  if(S.phase==="answer")return ["think","순서를 어떻게 맞추지?"];
  if(S.active)return ["think","어떤 단어가 들어갈까?"];
  return S.solved.size===0?["tiles","어서 풀어보자!"]:["smile","좋아, 계속 가자!"];
}
function qreact(n,ms,msg){qReactUntil=Date.now()+ms;setQ(n,true,msg);setTimeout(()=>{if(Date.now()>=qReactUntil)render();},ms+30);}
function gateFace(n,rand){gateState=n;setImg($("gFace"),sleeping?"sleep":n,rand);}
function baseFace(){
  if(S.phase==="done")return "love";
  if(S.phase==="wait")return "cheer";
  if(S.phase==="quiz"&&S.active)return "think";
  if(S.phase==="quiz"&&S.solved.size===0)return "tiles";
  if(S.phase==="quiz")return "smile";
  return "think";
}
function react(n,ms,msg){
  reactUntil=Date.now()+ms;setM(n,true,msg);
  setTimeout(()=>{if(Date.now()>=reactUntil)render();},ms+30);
}
function wake(){
  clearTimeout(sleepT);
  if(sleeping){sleeping=false;gateFace(gateState);gateMale(gMaleState);render();}
  sleepT=setTimeout(()=>{sleeping=true;setImg($("gFace"),"sleep");setM("sleep");setQ("sleep");if(gMaleState)setImgM($("gMale"),"sleep");},45000);
}
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,wake,true));

};

function matches(t){

function show(id){["gStart","gSay","gDone"].forEach(x=>$(x).hidden=(x!==id));$("gSign").hidden=(id!=="gStart");requestAnimationFrame(fitAll);}

/* ---------- 낱말퀴즈 ---------- */
const COLS=11, ROWS=13;
const W=[
  {id:1, ans:"사공이많으면배가산으로간다", x:4,y:0, dir:"V", hue:0, clue:"뱃사공이 너무 많으면 배가 어디로 갈까요? 의견이 너무 많으면 일이 엉뚱하게 흘러간다는 속담이에요. (13글자)"},
  {id:2, ans:"한옥", x:10,y:2, dir:"V", hue:28, clue:"기와지붕에 마루와 온돌이 있는, 우리나라 전통 집을 뭐라고 할까요?"},
  {id:3, ans:"옥상가옥", x:7,y:3, dir:"H", hue:52, clue:"지붕 위에 또 지붕을 얹는다는 뜻으로, 쓸데없이 같은 일을 되풀이한다는 사자성어예요. (4글자)"},
  {id:4, ans:"상온보관", x:8,y:3, dir:"V", hue:125, clue:"냉장고에 넣지 않고 보통의 실내 온도에서 두는 보관 방식이에요. (4글자)"},
  {id:5, ans:"웃으면복이온다", x:3,y:4, dir:"H", hue:190, clue:"활짝 웃으며 지내면 좋은 일이 찾아온다는 속담이에요. (7글자)"},
  {id:6, ans:"웰컴", x:0,y:9, dir:"V", hue:222, clue:"‘환영합니다’를 영어로 하면 ‘웰○’. 현관 앞 매트에 자주 적혀 있어요."},
  {id:7, ans:"컴퓨터프로그램", x:0,y:10, dir:"H", hue:272, clue:"컴퓨터가 일을 하도록 짜 놓은 명령의 묶음이에요. 줄여서 ‘프로그램’이라고도 해요. (7글자)"}
];
const FINAL="옥상으로컴온";

const cells={};
W.forEach(w=>{
  [...w.ans].forEach((ch,i)=>{
    const x=w.x+(w.dir==="H"?i:0), y=w.y+(w.dir==="V"?i:0), k=x+","+y;
    cells[k]=cells[k]||{x,y,ch,words:[],start:null};
    cells[k].words.push(w.id);
    if(i===0)cells[k].start=w.id;
  });
});
const inter=Object.keys(cells).filter(k=>cells[k].words.length>1);
const byId=id=>W.find(w=>w.id===id);
const wordKeys=w=>[...w.ans].map((_,i)=>(w.x+(w.dir==="H"?i:0))+","+(w.y+(w.dir==="V"?i:0)));

const S={solved:new Set(),active:null,preview:"",phase:"quiz",pink:new Set(),pop:new Set(),wrong:{},hint2:new Set(),wrongF:0};

function render(){
  const act=S.active?wordKeys(byId(S.active)):[];
  const solvedKeys=new Set();
  S.solved.forEach(id=>wordKeys(byId(id)).forEach(k=>solvedKeys.add(k)));
  let h="";
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const k=x+","+y,c=cells[k];
    if(!c){h+='<div class="gap"></div>';continue;}
    let ch="",cls="";
    if(solvedKeys.has(k))ch=c.ch;
    else if(S.active&&act.includes(k)){
      const p=[...S.preview][act.indexOf(k)];
      if(p){ch=p;cls+=" prev";}
    }
    if(act.includes(k))cls+=" act";
    if(S.pink.has(k))cls+=" pink";
    if(S.pop.has(k))cls+=" pop";
    const hu=byId(c.words[0]).hue;
    h+=`<div class="cell${cls}" data-k="${k}" role="gridcell" style="background:hsl(${hu},92%,84%);box-shadow:0 3px 0 hsl(${hu},58%,60%);color:#5a2f0f">${c.start?`<span class="n">${c.start}</span>`:""}${ch}</div>`;
  }
  $("grid").innerHTML=h;S.pop.clear();
  $("chips").innerHTML=W.map(w=>`<button class="chip${S.solved.has(w.id)?" ok":""}" data-id="${w.id}" aria-label="${w.id}번 문제">${w.id}</button>`).join("");
  const st=$("stage");st.className="stage";
  if(S.phase==="quiz")st.innerHTML=`번호를 눌러 문제를 풀어보세요<small>${S.solved.size} / ${W.length}</small>`;
  else if(S.phase==="touch")st.innerHTML=`여러 문장에 중복되는 단어를 터치해볼래?<small>${S.pink.size} / ${inter.length}</small>`;
  else if(S.phase==="answer")st.innerHTML=`단어들의 순서를 조합하여 장소를 찾아봐`;
  else if(S.phase==="done"){st.className="stage done";st.innerHTML=`📍 옥상으로 컴온<small>풍선을 찾아봐! 🎈</small>`;}
  $("answer").hidden=!(S.phase==="answer"||S.phase==="done");
  requestAnimationFrame(fitBoard);
  $("sheet").hidden=(S.phase!=="quiz");
  if(!S.active){
    $("sheet").style.removeProperty("--h");
    $("sTitle").textContent="문제";
    $("sClue").textContent="아래 낱말판의 번호를 눌러 문제를 골라보세요.";
    $("sFb").textContent="";
  }
  ["sIn","sOk","sHint"].forEach(id=>$(id).disabled=!S.active);
  $("sClose").hidden=!S.active;
  if(Date.now()>=reactUntil){const [bn,bm]=baseM();setM(sleeping?"sleep":bn,false,sleeping?null:bm);}
  if(Date.now()>=qReactUntil){const [qn,qm]=baseQ();setQ(sleeping?"sleep":qn,false,sleeping?null:qm);}
}

function fitBoard(){
  const b=document.querySelector(".board");if(!b||$("game").hidden)return;
  const c=getComputedStyle(b),g=3;
  const w=b.clientWidth-parseFloat(c.paddingLeft)-parseFloat(c.paddingRight);
  const h=b.clientHeight-parseFloat(c.paddingTop)-parseFloat(c.paddingBottom);
  const cs=Math.max(12,Math.floor(Math.min(34,(w-(COLS-1)*g)/COLS,(h-(ROWS-1)*g)/ROWS)));
  const gr=$("grid");gr.style.setProperty("--cs",cs+"px");
  gr.style.gridTemplateColumns="repeat("+COLS+","+cs+"px)";gr.style.gridAutoRows=cs+"px";
  const gw=COLS*cs+(COLS-1)*g,m=Math.max(0,(b.clientWidth-gw)/2);
  b.style.setProperty("--boyw",Math.max(64,Math.min(128,Math.round(m+4*(cs+g)-14),6*(cs+g)-38))+"px");
}
window.addEventListener("resize",()=>requestAnimationFrame(fitBoard));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>requestAnimationFrame(fitBoard));
function choseong(w){const C="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";return [...w.ans].map(c=>{const k=c.charCodeAt(0)-0xAC00;return k>=0&&k<11172?C[Math.floor(k/588)]:c;}).join("");}
function hint2Text(w){return "힌트 더! 초성은 “"+choseong(w)+"”, 첫 글자는 “"+w.ans[0]+"”이에요.";}
function openWord(id){
  if(S.solved.has(id))return;
  S.active=id;S.preview="";$("sheet").style.setProperty("--h",byId(id).hue);
  const w=byId(id);
  $("sTitle").textContent=`${id}번 · ${w.dir==="H"?"가로":"세로"} · ${w.ans.length}글자`;
  $("sClue").textContent=w.clue;
  $("sIn").value="";$("sFb").className="fb";$("sFb").textContent=S.hint2.has(id)?hint2Text(w):"";
  $("sheet").hidden=false;document.body.classList.add("sheet-open");render();
  const first=document.querySelector(`[data-k="${wordKeys(w)[0]}"]`);
  if(first)setTimeout(()=>first.scrollIntoView({block:"center",behavior:"smooth"}),60);
  setTimeout(()=>$("sIn").focus({preventScroll:true}),80);
}
function closeSheet(){
  S.active=null;S.preview="";$("sIn").value="";render();
}
$("sIn").addEventListener("input",e=>{S.preview=e.target.value.replace(/\s/g,"");render();});
$("sIn").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing)checkWord();});
$("sOk").onclick=checkWord;
$("sClose").onclick=closeSheet;
$("sHint").onclick=()=>{react("peek",1500);qreact("cheer",1500,"살짝 알려줄게요!");const w=byId(S.active);$("sFb").className="fb";$("sFb").textContent=`첫 글자는 “${w.ans[0]}”`;};

function checkWord(){
  const w=byId(S.active);if(!w)return;
  const v=$("sIn").value.replace(/\s/g,"");
  if(v===w.ans){
    S.solved.add(w.id);wordKeys(w).forEach(k=>S.pop.add(k));
    closeSheet();react("cheer",2200);qreact("wink",2200);
    if(S.solved.size===W.length){
      S.phase="wait";
      setTimeout(()=>showOv("제법인데요~?","계속",()=>{S.phase="touch";render();window.scrollTo({top:0,behavior:"smooth"});},"wink","cheer"),500);
    }
  }else{
    $("sFb").className="fb bad";S.wrong[w.id]=(S.wrong[w.id]||0)+1;if(S.wrong[w.id]>=3)S.hint2.add(w.id);const hh=S.hint2.has(w.id);$("sFb").textContent=hh?hint2Text(w):"아쉬워요. 다시 생각해 볼까요?";react("surprise",1800);hh?qreact("cheer",2200,"힌트를 더 줄게요!"):qreact("pout",1800);
    $("sIn").classList.remove("shake");void $("sIn").offsetWidth;$("sIn").classList.add("shake");
  }
}

$("grid").addEventListener("click",e=>{
  const el=e.target.closest("[data-k]");if(!el)return;
  const k=el.dataset.k,c=cells[k];
  if(S.phase==="quiz"){
    const id=(c.start&&!S.solved.has(c.start))?c.start:c.words.find(i=>!S.solved.has(i));
    if(id)openWord(id);
  }else if(S.phase==="touch"){
    if(c.words.length>1){
      if(!S.pink.has(k)){
        S.pink.add(k);render();react("cheer",1500,"찾았다! 겹치는 칸!");
        if(S.pink.size===inter.length){
          S.phase="wait";
          setTimeout(()=>showOv("단어들의 순서를 조합하여 장소를 찾아봐","좋아!",()=>{S.phase="answer";buildTray();render();},"wink","think"),600);
        }
      }
    }else{
      el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake");react("think",1500,"여긴 아닌가…");
    }
  }
});
$("chips").addEventListener("click",e=>{
  const b=e.target.closest("[data-id]");
  if(b&&S.phase==="quiz")openWord(+b.dataset.id);
});

function showOv(msg,btn,cb,face,face2){
  setImg($("ovFace"),face||"wink",true);setImgM($("ovFace2"),face2||"cheer",true);
  $("ovMsg").textContent=msg;$("ovBtn").textContent=btn;$("ov").hidden=false;
  $("ovBtn").onclick=()=>{$("ov").hidden=true;cb();};
}

function buildTray(){
  const letters=inter.map(k=>cells[k]).sort((a,b)=>a.y-b.y||a.x-b.x).map(c=>c.ch);
  $("tray").innerHTML=letters.map(l=>`<button type="button" data-l="${l}">${l}</button>`).join("");
}
$("tray").addEventListener("click",e=>{
  const b=e.target.closest("[data-l]");if(b&&S.phase==="answer")$("aIn").value+=b.dataset.l;
});
$("aClear").onclick=()=>{$("aIn").value="";$("aFb").textContent="";};
$("aHint").onclick=()=>{react("peek",1500);$("aFb").className="fb";$("aFb").textContent="장소는 건물 맨 위, 하늘과 가까운 곳이에요. 마지막은 영어로 “이리 와”라는 뜻이에요!";};
function checkFinal(){
  if(S.phase!=="answer")return;
  const v=$("aIn").value.replace(/\s/g,"");
  if(v===FINAL){S.phase="done";$("aFb").textContent="";render();startFinale();}
  else{
    $("aFb").className="fb bad";S.wrongF++;$("aFb").textContent=S.wrongF>=3?"힌트 더! 앞부분은 “"+FINAL.slice(0,3)+"”이에요. 나머지는 모은 글자로 맞춰 봐요.":"순서를 다시 조합해 볼까요?";react("surprise",1800,"앗, 순서가 달라!");
    $("aIn").classList.remove("shake");void $("aIn").offsetWidth;$("aIn").classList.add("shake");
  }
}
$("aOk").onclick=checkFinal;
$("aIn").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing)checkFinal();});

function fireworks(duration){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=$("fx"),ctx=cv.getContext("2d"),dpr=window.devicePixelRatio||1;
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const colors=["#ffe08a","#f2c94c","#ff7eb6","#ffffff","#9be3b0","#8ecbff"];
  let parts=[],last=0,end=performance.now()+duration;
  function burst(x,y){
    const c=colors[Math.random()*colors.length|0];
    for(let i=0;i<70;i++){
      const a=Math.random()*Math.PI*2,v=1.5+Math.random()*4.5;
      parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,c:Math.random()<.25?"#fff":c});
    }
  }
  function frame(t){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    if(t<end&&t-last>420){burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.12+Math.random()*.45));last=t;}
    parts=parts.filter(p=>p.life>0);
    parts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.vy+=.055;p.vx*=.985;p.life-=.011;
      ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.c;
      ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,7);ctx.fill();
    });
    ctx.globalAlpha=1;
    if(t<end||parts.length)requestAnimationFrame(frame);else ctx.clearRect(0,0,innerWidth,innerHeight);
  }
  requestAnimationFrame(frame);
}
const BALLOON='<svg class="balloon" viewBox="0 0 100 170" aria-hidden="true"><defs><radialGradient id="bgr" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ff9aae"/><stop offset="1" stop-color="#e02a4a"/></radialGradient></defs><ellipse cx="50" cy="55" rx="38" ry="48" fill="url(#bgr)"/><ellipse cx="36" cy="36" rx="9" ry="14" fill="#fff" opacity=".45" transform="rotate(-25 36 36)"/><path d="M50 102l-7 11h14z" fill="#c0233f"/><path d="M50 113Q38 130 52 145Q63 158 48 168" stroke="#8a6a50" stroke-width="2" fill="none"/></svg>';
let finTimer=null;
function setFinText(t){const el=$("finT");el.textContent=t;el.classList.remove("swap");void el.offsetWidth;el.classList.add("swap");}
function startFinale(){
  clearTimeout(finTimer);

$("finClose").onclick=()=>{$("fin").hidden=true;};

gateFace("wave");wake();fitAll();
